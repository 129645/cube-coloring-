<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>積木染色記憶</title>
<style>
:root{color-scheme:light;--bg:#F7F3EA;--surface:#FFF;--ink:#17212B;--muted:#46525F;--primary:#0A4F9E;--on-primary:#FFF;--line:#6B7785;--ok:#0B6B3A;--ok-bg:#DCF5E6;--help:#7A4300;--help-bg:#FFEFCF;--cue:#B45309;--touch:72px;--scale:1}
html[data-contrast=high]{--bg:#FFF;--surface:#FFF;--ink:#000;--muted:#000;--primary:#000;--line:#000;--ok:#000;--ok-bg:#FFF;--help:#000;--help-bg:#FFF;--cue:#000}
html{font-size:calc(20px*var(--scale))}
html[data-audience=elder]{font-size:calc(23px*var(--scale))}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.45;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-text-size-adjust:100%}
#app{height:100vh;height:100dvh;max-width:1000px;margin:auto;display:flex;flex-direction:column;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
h1{font-size:1.9rem;line-height:1.25;margin:.2em 0}h2{font-size:1.4rem;margin:.2em 0}p{margin:.4em 0}
button,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:4px solid var(--cue);outline-offset:3px}
.btn{min-height:var(--touch);min-width:var(--touch);padding:.45em 1em;border:3px solid var(--line);border-radius:16px;background:var(--surface);font-weight:700}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.quiet{min-height:52px;font-weight:600}
.btn[disabled]{opacity:.45;cursor:default}
.screen{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:14px}
.center{justify-content:center;align-items:center;text-align:center}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.bar{display:flex;align-items:center;gap:12px;padding-bottom:8px}
.track{flex:1;min-width:20px;height:12px;border:2px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.fill{height:100%;background:var(--primary);transition:width .3s}
.count{font-weight:700;white-space:nowrap;line-height:1.2}.count small{display:block;font-size:.85rem;font-weight:600}
.prompt{display:flex;align-items:center;gap:10px;font-size:1.3rem;font-weight:700;min-height:64px;padding-bottom:6px}
.prompt>span{flex:1}
.stage{flex:1;min-height:0;overflow:auto;padding:8px 6px;display:flex;flex-direction:column;gap:12px}
.feedback{min-height:3.2em;margin-top:8px;padding:.4em .8em;border-radius:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.help{background:var(--help-bg);color:var(--help)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(9rem,42%),1fr));margin:auto 0}
.opt{min-width:0;overflow-wrap:anywhere;min-height:calc(var(--touch) + 24px);padding:.5em;border:3px solid var(--line);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;font-weight:700}
.opt .icon{font-size:2.5rem;line-height:1.1}
.opt.selected{border-color:var(--primary);border-width:6px}
.opt[disabled]{opacity:.35;cursor:default}
.cue{border-color:var(--cue)!important;border-width:6px!important;animation:cue 1.6s ease-in-out infinite}
@keyframes cue{50%{box-shadow:0 0 0 9px rgba(180,83,9,.28)}}
.overlay{position:fixed;inset:0;background:rgba(23,33,43,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.panel{background:var(--surface);border-radius:20px;padding:22px;max-width:520px;width:100%;max-height:100%;overflow:auto;text-align:center;display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 0;border-bottom:1px solid var(--line)}
.row select{min-height:52px;min-width:120px;max-width:55%;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{border-bottom:1px solid var(--line);padding:6px;text-align:left}
.pop{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.94)}}
html[data-motion=off] *{animation:none!important;transition:none!important}
html[data-paused] *{animation-play-state:paused!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:480px){:root{--touch:60px}html{font-size:calc(17px*var(--scale))}html[data-audience=elder]{font-size:calc(19px*var(--scale))}.prompt{min-height:52px;font-size:1.1rem}.opt{min-height:64px}.opt .icon{font-size:1.7rem}.feedback{min-height:2em;margin-top:4px}.grid{grid-template-columns:repeat(auto-fit,minmax(7rem,1fr))}}
.filters{display:flex;flex-wrap:wrap;gap:10px}.filters label{flex:1 1 8rem;display:flex;flex-direction:column;font-weight:600;font-size:.85rem;gap:2px}.filters select{min-height:52px;width:100%;border:2px solid var(--line);border-radius:10px;background:var(--surface);padding:0 8px;font-size:1rem}
#chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;flex:none;min-height:120px;touch-action:pan-y}
#chart svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#FFF;border-radius:8px;padding:.3em .6em;font-size:.8rem;line-height:1.35;max-width:220px;z-index:2}
.table-wrap{overflow-x:auto;flex:none}
.note{font-size:.85rem}
.user-row{display:flex;gap:10px;align-items:stretch}.user-row .pick{flex:1;text-align:left}
.add-user{display:flex;gap:10px;flex-wrap:wrap}.add-user input{flex:1 1 8rem;min-height:56px;min-width:0;font:inherit;border:2px solid var(--line);border-radius:12px;padding:0 .6em;background:var(--surface);color:var(--ink);user-select:text;-webkit-user-select:text}
@media (max-height:480px){.opt{flex-direction:row;gap:.5em}.stage .grid,.grid{grid-template-columns:repeat(auto-fit,minmax(9rem,1fr))!important}}
/* ===== 遊戲專屬樣式從這裡開始 ===== */
.bd{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:0;align-items:stretch}
.bd-panel{position:relative;container-type:inline-size;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:8px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.bd-panel h3{margin:0;font-size:1rem;align-self:flex-start;padding:.1em .7em;border-radius:99px;background:var(--bg);border:2px solid var(--line)}
.bd-panel.off .bd-blocks,.bd-panel.off .bd-pal,.bd-panel.off .bd-replay{opacity:.45}
.bd-lane{position:relative;width:100%;height:136px;flex:none}
.bd-dropper{position:absolute;top:0;left:50%;height:130px;width:auto;transform:translateX(-50%);transition:left .35s ease-in-out;pointer-events:none}
.bd-drop{position:absolute;left:0;top:0;width:18px;height:24px;margin-left:-9px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;border:2px solid rgba(0,0,0,.35);opacity:0;pointer-events:none;z-index:3}
.bd-blocks{--b:clamp(60px,21cqw,104px);display:inline-flex;flex-direction:column-reverse;align-items:flex-start;gap:2px;margin:auto 0}
.bd-row{display:flex;gap:4px}
.bd-blk{position:relative;width:var(--b);height:var(--b);padding:0;border:0;background:none;border-radius:12px;display:block;flex:none}
.bd-blk img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.45));pointer-events:none}
.bd-num{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);min-width:1.5em;height:1.5em;line-height:1.5em;border-radius:99px;background:#FFF;color:#17212B;border:2px solid #17212B;font-size:.8rem;font-weight:700;text-align:center;pointer-events:none}
button.bd-blk.next{outline:3px dashed var(--primary);outline-offset:-1px}
button.bd-blk[disabled]{cursor:default}
.bd-pal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
@container (min-width:520px){.bd-pal{grid-template-columns:repeat(6,minmax(0,1fr))}}
.bd-col{min-height:64px;min-width:0;padding:4px 2px;border:3px solid var(--line);border-radius:14px;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:.85rem;line-height:1.2}
.bd-col i{display:block;width:30px;height:30px;border-radius:50%;border:2px solid #17212B}
.bd-col.selected{border-color:var(--primary);border-width:6px;background:var(--bg)}
.bd-col[disabled]{opacity:.3;cursor:default}
.bd-replay{min-height:52px}
@media (max-width:619px){.bd{grid-template-columns:1fr}.bd.is-demo .bd-a,.bd.is-answer .bd-q{display:none}.bd-lane{height:112px}.bd-dropper{height:106px}}
@media (min-width:900px) and (min-height:700px){.bd-lane{height:176px}.bd-dropper{height:170px}}
@media (max-height:480px){.bd-lane{height:92px}.bd-dropper{height:88px}.bd-blocks{--b:60px}.bd-panel h3{font-size:.85rem}.bd-col{min-height:60px;flex-direction:row;gap:6px}.bd-col i{width:24px;height:24px}}
/* ===== 遊戲專屬樣式到此結束 ===== */
</style>
</head>
<body>
<div id="app"></div>

'use strict';
/* ========== 1. CONFIG:老師、治療師或開發者主要改這裡 ========== */
const CONFIG = {

const GAME = {
  sounds: [], si: 0,
  plop() {
    try {
      if (typeof settings !== 'undefined' && settings.sound === false) return;
      if (!this.sounds.length) for (let i = 0; i < 3; i++) this.sounds.push(new Audio(ASSETS.drop));
      const a = this.sounds[this.si++ % 3]; a.currentTime = 0; const p = a.play(); if (p && p.catch) p.catch(() => {});
    } catch (e) {}
  },
  startRound(api) {
    const { colors, layouts, stepMs } = api.content, h = api.h, lv = api.lv;
    const n = api.randInt(lv.minBlocks, lv.maxBlocks);
    const layout = api.pick(layouts[n]);
    const seq = [];
    for (let i = 0; i < n; i++) seq.push(api.pick(colors.filter(c => !i || c !== seq[i - 1])));
    api.record({ blocks: n, layout: layout.join('+'), sequence: seq.map(c => c.name).join('→'), holdSec: lv.holdSec });

    const build = tag => {
      const cells = [], wrap = h('div', { class: 'bd-blocks' });
      let k = 0;
      layout.forEach(count => {
        const row = h('div', { class: 'bd-row' });
        for (let j = 0; j < count; j++) {
          const img = h('img', { src: ASSETS.cube.white, alt: '' });
          const el = h(tag, { class: 'bd-blk' }, img, h('span', { class: 'bd-num', text: String(++k) }));
          el._img = img; cells.push(el); row.append(el);
        }
        wrap.append(row);
      });
      return { wrap, cells };
    };
    const setColor = (el, c) => { el._img.src = c ? ASSETS.cube[c.id] : ASSETS.cube.white; };

    // 題目區
    const dropper = h('img', { class: 'bd-dropper', src: ASSETS.dropper.plain, alt: '滴管' });
    const lane = h('div', { class: 'bd-lane' }, dropper);
    const drop = h('div', { class: 'bd-drop' });
    const Q = build('div');
    const qPanel = h('section', { class: 'bd-panel bd-q' }, h('h3', { text: '題目區' }), lane, Q.wrap, drop);
    // 答題區
    const A = build('button');
    const palBtns = colors.map(c => {
      const b = h('button', { class: 'bd-col', onTap: () => tapColor(c) }, h('i', { style: 'background:' + c.hex }), h('span', { text: c.name }));
      b._c = c; return b;
    });
    const pal = h('div', { class: 'bd-pal' }, palBtns);
    const replay = h('button', { id: 'bd-replay', class: 'btn quiet bd-replay', text: '再看一次', onTap: () => { if (phase !== 'answer') return; api.assisted(); api.say(''); demo(); } });
    const aPanel = h('section', { class: 'bd-panel bd-a off' }, h('h3', { text: '答題區' }), A.wrap, pal, replay);
    A.cells.forEach((b, i) => { b.setAttribute('aria-label', `第 ${i + 1} 塊積木`); b.addEventListener('click', () => tapBlock(i)); });
    const root = h('div', { class: 'bd is-demo' }, qPanel, aPanel);
    api.stage.append(root);

    let phase = 'demo', idx = 0, sel = null;

    function update() {
      const answering = phase === 'answer', need = seq[idx];
      aPanel.classList.toggle('off', !answering);
      root.classList.toggle('is-demo', phase === 'demo'); root.classList.toggle('is-answer', phase !== 'demo');
      replay.disabled = !answering;
      palBtns.forEach(b => {
        b.disabled = !answering; b.classList.toggle('selected', answering && sel === b._c);
        b.setAttribute('aria-pressed', String(sel === b._c));
        delete b.dataset.answer;
        if (answering && sel !== need) b.dataset.answer = b._c === need ? 'correct' : 'wrong';
      });
      A.cells.forEach((b, i) => {
        delete b.dataset.answer;
        b.disabled = !answering || i < idx;
        b.classList.toggle('next', answering && i === idx);
        if (answering && i === idx && sel) b.dataset.answer = sel === need ? 'correct' : 'wrong';
      });
      api.refresh();
    }
    function tapColor(c) { if (phase !== 'answer') return; sel = c; update(); }
    function tapBlock(i) {
      if (phase !== 'answer' || i < idx) return;
      if (i > idx) return api.say(`請照順序,先塗第 ${idx + 1} 塊`, 'help');
      if (!sel) return api.say('先點下面的顏色,再點積木', 'help');
      if (sel !== seq[idx]) { api.miss(`第 ${idx + 1} 塊不是${sel.name},再想想看`); update(); return; }
      setColor(A.cells[idx], sel); A.cells[idx].classList.add('pop'); GAME.plop();
      idx++; sel = null;
      if (idx === n) {
        phase = 'done'; update();
        Q.cells.forEach((el, k) => setColor(el, seq[k]));
        api.correct('全部正確,做得很好!');
      } else { api.stepOk(`第 ${idx} 塊對了,接著第 ${idx + 1} 塊`); update(); }
    }

    // 示範:滴管依序染色 → 停留 holdSec 秒 → 顏色消失 → 開始作答
    function centerOf(el, base) { const r = el.getBoundingClientRect(), b = base.getBoundingClientRect(); return { x: r.left + r.width / 2 - b.left, y: r.top + r.height * .3 - b.top }; }
    function demo() {
      phase = 'demo'; sel = null; update();
      api.prompt('仔細看,記住每一塊積木的顏色');
      Q.cells.forEach(el => setColor(el, null));
      let i = 0;
      const step = () => {
        if (i === n) return api.after(lv.holdSec * 1000, hide);
        const c = seq[i], el = Q.cells[i];
        dropper.src = ASSETS.dropper[c.id];
        dropper.style.left = centerOf(el, lane).x + 'px';
        api.after(stepMs, () => {
          const tip = dropper.getBoundingClientRect(), p = qPanel.getBoundingClientRect(), to = centerOf(el, qPanel);
          const x = tip.left + tip.width / 2 - p.left, y0 = tip.bottom - p.top - 6;
          drop.style.transition = 'none'; drop.style.background = c.hex; drop.style.opacity = '1';
          drop.style.transform = `translate(${x}px,${y0}px)`;
          void drop.offsetWidth;
          drop.style.transition = `transform ${Math.round(stepMs * (typeof TIME === 'number' ? TIME : 1))}ms ease-in`;
          drop.style.transform = `translate(${x}px,${to.y}px)`;
          api.after(stepMs, () => {
            drop.style.opacity = '0'; setColor(el, c); el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); GAME.plop();
            i++; api.after(stepMs, step);
          });
        });
      };
      api.after(600, step);
    }
    function hide() {
      Q.cells.forEach(el => setColor(el, null));
      dropper.src = ASSETS.dropper.plain; dropper.style.left = '50%';
      phase = 'answer'; update();
      api.prompt('照 1、2、3 的順序,塗上剛才的顏色');
      api.ready();
    }
    demo();
  },
};

let seed = (Number(params.get('seed')) || Date.now()) >>> 0;
const rand = () => { seed = (seed + 0x6D2B79F5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const randInt = (a, b) => a + Math.floor(rand() * (b - a + 1));
const pick = a => a[Math.floor(rand() * a.length)];
const shuffle = a => { const r = [...a]; for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; /* 無法儲存時仍可遊玩 */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};
const KEY_S = CONFIG.storageKey + ':settings', KEY_L = CONFIG.storageKey + ':log';

function saveLog(log) {
  memLog = log.slice(-3000);

}

    ? h('button', { id: 'clear-yes', class: 'btn quiet', text: view.user === '*' ? '確定清除所有人的紀錄' : `確定清除${view.user}的紀錄`, onTap: () => { saveLog(view.user === '*' ? [] : log.filter(l => (l.user || GUEST) !== view.user)); renderRecords(); } })
    : h('button', { id: 'clear', class: 'btn quiet', text: '清除紀錄', disabled: !mine.length, onTap: () => renderRecords(true) });
  const msg = h('p', { id: 'data-msg', class: 'note', 'aria-live': 'polite', text: saveFailed ? '注意:瀏覽器無法儲存資料,關閉頁面後紀錄會消失,請先下載備份。' : '' });
  const file = h('input', { id: 'restore-file', type: 'file', accept: '.json,application/json', hidden: true, onChange: e => { if (e.target.files[0]) restoreBackup(e.target.files[0], msg); } });
  const chart = h('div', { id: 'chart' });
  show('records', h('div', { class: 'screen' },
    h('h2', { text: '成果與數據' }),
    h('div', { class: 'filters' },
      filterSelect('使用者', 'f-user', view.user, [...users.list.map(u => [u, u]), ['*', '全部使用者']], v => { view.user = v; }),
      filterSelect('項目', 'f-metric', view.metric, Object.entries(METRICS).map(([k, m]) => [k, m.label]), v => { view.metric = v; }),
      filterSelect('期間', 'f-range', view.range, [['all', '全部'], ['90', '近 90 天'], ['30', '近 30 天'], ['7', '近 7 天']], v => { view.range = v; })),
    chart,
    h('p', { id: 'chart-summary', class: 'note' }),
    mine.length ? h('div', { class: 'table-wrap' }, h('table', { id: 'sessions' }, h('thead', {}, h('tr', {}, ['使用者', '日期', '分數', '等級', '正確率', '反應秒'].map(t => h('th', { text: t })))),
      h('tbody', {}, mine.slice(-30).reverse().map(l => h('tr', {}, [l.user || GUEST, l.at.slice(0, 16), fmt(l.score), l.startLevel === l.endLevel ? l.endLevel : `${l.startLevel}→${l.endLevel}`, l.accuracy === null ? '—' : l.accuracy + '%', fmt(l.rtMedian)].map(v => h('td', { text: String(v) })))))))
      : h('p', { text: '目前還沒有紀錄。' }),
    last && last.perLevel && h('h2', { text: '最近一次:各等級' }),
    last && last.perLevel && h('div', { class: 'table-wrap' }, h('table', { id: 'per-level' }, h('thead', {}, h('tr', {}, ['等級', '題數', '正確率', '反應秒'].map(t => h('th', { text: t })))),
      h('tbody', {}, last.perLevel.map(p => h('tr', {}, [p.level, p.count, p.accuracy === null ? '—' : p.accuracy + '%', fmt(p.rtMedian)].map(v => h('td', { text: String(v) }))))))),
    h('p', { class: 'note', text: `分數=正確率×${SCORE.accuracy}+(平均等級÷5×100)×${SCORE.level}。正確率=正確反應÷(正確+錯誤+未反應)。反應秒=題目可作答到第一次按下的中位數,只計正確且未先答錯的反應。數據只存在這台裝置和這個瀏覽器,僅供日常練習參考,不是評估或診斷結果。` }),
    msg, file,
    h('div', { class: 'actions' },
      h('button', { id: 'chart-png', class: 'btn quiet', text: '下載曲線圖', disabled: !mine.length, onTap: downloadChart }),
      h('button', { id: 'export', class: 'btn quiet', text: '下載摘要 CSV', disabled: !log.length, onTap: () => download(base + '-摘要.csv', summaryCsv(log)) }),
      h('button', { id: 'export-trials', class: 'btn quiet', text: '下載逐題 CSV', disabled: !log.length, onTap: () => download(base + '-逐題.csv', trialCsv(log)) }),
      h('button', { id: 'backup', class: 'btn quiet', text: '下載備份', disabled: !log.length, onTap: () => download(base + '-備份.json', JSON.stringify({ game: CONFIG.storageKey, users: users.list, log }), 'application/json') }),
      h('button', { id: 'restore', class: 'btn quiet', text: '還原備份', onTap: () => file.click() }),
      clear,
      h('button', { id: 'back-settings', class: 'btn quiet', text: '返回', onTap: renderSettings })),
  ));
  drawChart(chart, log);
  if (resizeHook) window.removeEventListener('resize', resizeHook);
  resizeHook = () => { if (screen === 'records' && document.getElementById('chart')) drawChart(document.getElementById('chart'), getLog()); };
  window.addEventListener('resize', resizeHook);
}

function startSession() {
  unlockAudio(); hush();
  S = { level: clampLevel(settings.level), startLevel: clampLevel(settings.level), i: 0, total: settings.rounds, rounds: [], up: 0, down: 0, at: new Date() };
  nextRound();
}
function nextRound() {
  clearTimers();
  if (S.i >= S.total) return finish();
  // 以成功收尾:最後一題若前一題有困難,就降一級
  const last = S.rounds[S.rounds.length - 1];
  const level = (settings.adaptive && S.i === S.total - 1 && last && last.errors > 0) ? Math.max(1, S.level - 1) : S.level;
  R = { level, misses: 0, stepMisses: 0, stepErr: false, hits: 0, omissions: 0, assisted: false, rts: [], first: null, readyAt: null, done: false, began: clock(), data: {} };
  ui.fill = h('div', { class: 'fill', style: `width:${S.i / S.total * 100}%` });
  ui.text = h('span');
  ui.replay = h('button', { id: 'replay', class: 'btn quiet', 'aria-label': '再聽一次', text: '🔊', onTap: () => speak(ui.text.textContent) });
  ui.stage = h('div', { id: 'stage', class: 'stage' });
  ui.feedback = h('div', { id: 'feedback', class: 'feedback', 'aria-live': 'polite' });
  show('play',
    h('div', { class: 'bar' },
      h('div', { class: 'count' }, `第 ${S.i + 1} / ${S.total} 題`, h('small', { text: `等級 ${level}` })),
      h('div', { class: 'track' }, ui.fill),
      h('button', { id: 'pause', class: 'btn quiet', text: '休息', onTap: pause })),
    h('div', { class: 'prompt' }, ui.text, ui.replay),
    ui.stage, ui.feedback);
  api.level = level; api.lv = CONFIG.levels[level - 1]; api.round = S.i; api.total = S.total; api.stage = ui.stage;
  GAME.startRound(api);
  if (R.readyAt === null) R.readyAt = clock();
}
function say(text, kind) { ui.feedback.textContent = text || ''; ui.feedback.className = 'feedback' + (kind ? ' ' + kind : ''); }
function endRound(rec, msg, kind, wait) {
  R.done = true; clearTimers(); ui.stage.inert = true;
  const solo = R.misses === 0 && !rec.passed && !R.assisted;
  const sec = ms => ms === null ? null : Number((ms / 1000).toFixed(3));
  S.rounds.push({ n: S.i + 1, level: R.level, outcome: solo ? '獨立完成' : rec.passed ? '未完成' : '協助後完成', solo,
    hits: R.hits, errors: R.misses, omissions: R.omissions, rts: R.rts.map(sec),
    firstRt: sec(R.first), rt: R.rts.length ? sec(R.rts.reduce((a, b) => a + b, 0) / R.rts.length) : null,
    seconds: Number(((clock() - R.began) / 1000).toFixed(2)), custom: Object.keys(R.data).length ? R.data : undefined });
  if (settings.adaptive) {
    if (solo) { S.up++; S.down = 0; if (S.up >= CONFIG.upAfter && S.level < MAX_LEVEL) { S.level++; S.up = 0; msg += ' 下一題多一點挑戰!'; } }
    else if (R.misses >= 2 || rec.passed) { S.down++; S.up = 0; if (S.down >= CONFIG.downAfter && S.level > 1) { S.level--; S.down = 0; } }
  }
  ui.fill.style.width = (S.i + 1) / S.total * 100 + '%';
  say(msg, kind);
  after(wait, () => { S.i++; nextRound(); });
}
function applyCue() {
  if (!R || !ui.stage) return;
  ui.stage.querySelectorAll('.cue').forEach(e => e.classList.remove('cue'));
  if (R.stepMisses >= 2) ui.stage.querySelectorAll('[data-answer="correct"]').forEach(e => e.classList.add('cue'));
  if (R.stepMisses >= 3) ui.stage.querySelectorAll('[data-answer="wrong"]').forEach(e => { e.disabled = true; });
}
/* 量測:反應時間從 api.ready() 算到手指按下(不是放開);休息時間不計;少於 150 毫秒視為誤觸 */
let lastDown = -1;
document.addEventListener('pointerdown', () => { lastDown = performance.now(); }, true);
function takeRT() {
  if (!R || R.readyAt === null) return null;
  const now = clock(), back = performance.now() - lastDown;
  const ms = now - (lastDown > 0 && back < 1500 ? back : 0) - R.readyAt;
  return ms < 0 ? now - R.readyAt : ms;
}
function mark(isHit, noResponse) {
  const rt = noResponse ? null : takeRT();
  if (rt !== null && R.first === null) R.first = rt;
  if (isHit) { R.hits++; if (rt !== null && !R.stepErr && (TEST || rt >= 150)) R.rts.push(rt); }
  else R.stepErr = true;
  R.readyAt = clock();
}
const api = {
  content: CONFIG.content, lv: CONFIG.levels[0], level: 1, round: 0, total: 0, stage: null, audience: CONFIG.audience, you,
  rand, randInt, pick, shuffle, h, after, cancel, now: clock, tone,
  speak,
  /** 設定題目文字並朗讀 */
  prompt(text, silent) { ui.text.textContent = text; if (!silent) speak(text); },
  /** 中性提示,不計對錯 */
  say(text, kind) { say(text, kind); },
  /** 建立選項按鈕。correct:true、false 或不給(中性按鈕) */
  option({ icon, label, correct, onTap, className, disabled, id }) {
    const b = h('button', { class: 'opt ' + (className || ''), id, disabled, onTap },
      icon !== undefined && h('span', { class: 'icon', 'aria-hidden': 'true', text: icon }), label !== undefined && h('span', { text: label }));
    if (correct === true) b.dataset.answer = 'correct';
    if (correct === false) b.dataset.answer = 'wrong';
    return b;
  },
  grid(nodes, cols) { const g = h('div', { class: 'grid' }, nodes); if (cols) g.style.gridTemplateColumns = `repeat(${cols},minmax(0,1fr))`; return g; },
  /** 清空舞台重畫時用;重畫完呼叫 refresh() 讓提示維持 */
  clear() { ui.stage.replaceChildren(); },
  refresh: applyCue,
  /** 題目真正可以作答的瞬間呼叫(例如刺激出現、示範播完)。沒呼叫時以題目畫好為起點 */
  ready() { if (R) R.readyAt = clock(); },
  /** 使用者用了「再看一次」等協助:本題不算獨立完成 */
  assisted() { if (R) R.assisted = true; },
  /** 把遊戲專屬數值寫進逐題紀錄,例如 api.record({step:'找錢'}) */
  record(d) { Object.assign(R.data, d); },
  /** 多步驟任務的中途正確:提示層級歸零 */
  stepOk(msg) { if (!R || R.done) return; mark(true); R.stepErr = false; R.stepMisses = 0; say(msg, 'ok'); tone([659]); },
  /** 本題完成。正確地「沒有按」時傳 {noResponse:true},不計反應時間 */
  correct(msg, opts = {}) { if (!R || R.done || paused) return; mark(true, opts.noResponse); tone([523, 659]); endRound({ passed: false }, msg || (CONFIG.audience === 'elder' ? '正確,做得很好。' : '做對了,好棒!'), 'ok', 1100); },
  /** 沒有回應時平順換題,不責備但計入「未反應」。按錯後換題傳 {omission:false} */
  pass(msg, opts = {}) { if (!R || R.done || paused) return; if (opts.omission !== false) R.omissions++; endRound({ passed: true }, msg || '沒關係,我們看下一題。', 'help', 900); },
  /** 答錯:第 1 次口頭提示,第 2 次標示正確答案,第 3 次只留正確答案 */
  miss(msg, opts = {}) {
    if (!R || R.done || paused) return;
    mark(false); R.misses++; R.stepMisses++;
    say(msg || '再試一次', 'help');
    if (opts.cue !== false) applyCue();
  },
};
function pause() {
  if (paused || screen !== 'play') return;
  paused = true; pausedAt = performance.now(); hush();
  document.documentElement.dataset.paused = '1';
  timers.forEach(t => { clearTimeout(t.id); t.left = Math.max(0, t.left - (pausedAt - t.began)); });
  ui.overlay = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'panel' },
    h('h2', { text: '休息一下' }), h('p', { text: `${you}想繼續的時候再按「繼續」。` }),
    h('button', { id: 'resume', class: 'btn primary', text: '繼續', onTap: resume }),
    h('button', { id: 'quit', class: 'btn', text: '今天先到這裡', onTap: () => { resume(); finish(); } })));
  document.body.append(ui.overlay);
}
function resume() {
  if (!paused) return;
  pausedTotal += performance.now() - pausedAt; paused = false;
  delete document.documentElement.dataset.paused;
  if (ui.overlay) ui.overlay.remove();
  timers.forEach(t => { t.began = performance.now(); t.id = setTimeout(t.fire, t.left); });
}
function stats(rounds) {
  const hits = rounds.reduce((a, r) => a + r.hits, 0), errors = rounds.reduce((a, r) => a + r.errors, 0), omissions = rounds.reduce((a, r) => a + r.omissions, 0);
  const n = hits + errors + omissions, rts = rounds.flatMap(r => r.rts).sort((a, b) => a - b);
  const mean = rts.length ? rts.reduce((a, b) => a + b, 0) / rts.length : null;
  const mid = rts.length ? (rts.length % 2 ? rts[(rts.length - 1) / 2] : (rts[rts.length / 2 - 1] + rts[rts.length / 2]) / 2) : null;
  const sd = rts.length > 1 ? Math.sqrt(rts.reduce((a, b) => a + (b - mean) ** 2, 0) / (rts.length - 1)) : null;
  const f2 = v => v === null ? null : Number(v.toFixed(2));
  return { hits, errors, omissions, accuracy: n ? Math.round(hits / n * 100) : null, rtMedian: f2(mid), rtMean: f2(mean), rtSD: f2(sd) };
}
function summarize() {
  const rs = S.rounds, done = rs.length, solo = rs.filter(r => r.solo).length, pad = n => String(n).padStart(2, '0'), d = S.at;
  const levels = [...new Set(rs.map(r => r.level))].sort((a, b) => a - b);
  const avgLevel = done ? rs.reduce((a, r) => a + r.level, 0) / done : 0, st = stats(rs);
  const score = st.accuracy === null ? null : Math.round(st.accuracy * SCORE.accuracy + avgLevel / MAX_LEVEL * 100 * SCORE.level);
  return { user: users.current, score, avgLevel: Number(avgLevel.toFixed(2)), at: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`,
    mode: settings.adaptive ? '自動' : '固定', startLevel: S.startLevel, endLevel: S.level, done, solo, helped: done - solo, ...st,
    firstTry: done ? Math.round(solo / done * 100) : null, seconds: Number(rs.reduce((a, r) => a + r.seconds, 0).toFixed(1)),
    perLevel: levels.map(l => { const sub = rs.filter(r => r.level === l), t = stats(sub); return { level: l, count: sub.length, accuracy: t.accuracy, rtMedian: t.rtMedian }; }),
    trials: rs.map(({ rts, solo, ...t }) => t) };
}
function finish() {
  clearTimers(); R = null;
  const entry = summarize(); const { done, solo } = entry;
  if (done) { const log = getLog(); log.push(entry); saveLog(log); }
  if (settings.adaptive) { settings.level = S.level; saveSettings(); }
  tone([523, 659, 784]);
  const headline = done ? (CONFIG.audience === 'elder' ? '今天的練習完成了,辛苦了!' : '你完成練習了,太棒了!') : '今天先休息,下次再來。';
  show('result', h('div', { class: 'screen center pop' },
    h('div', { 'aria-hidden': 'true', style: 'font-size:3.4rem', text: done ? '🌟' : '🌿' }),
    h('h1', { text: headline }),
    done && settings.showScore && entry.score !== null ? h('p', { id: 'score', style: 'font-size:1.5rem;font-weight:700', text: `今天的分數:${entry.score} 分` }) : null,
    done ? h('p', { id: 'summary', text: `完成 ${done} 題,其中 ${solo} 題自己完成。` }) : null,
    h('div', { class: 'actions' },
      h('button', { id: 'again', class: 'btn primary', text: '再練一次', onTap: startSession }),
      h('button', { id: 'home', class: 'btn', text: '回首頁', onTap: renderHome }),
      done ? h('button', { id: 'data', class: 'btn', text: '查看成果曲線', onTap: () => { view.user = users.current; view.metric = 'score'; renderRecords(); } }) : null),
  ));
  speak(headline);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') paused ? resume() : pause(); });
window.addEventListener('error', e => { console.error('GAME_ERROR', e.message); });
/* 給自動檢查工具使用 */
window.__GAME__ = { config: CONFIG, log: getLog, state: () => ({ screen, paused, level: S && S.level, round: S && S.i, total: S && S.total, misses: R && R.misses, rounds: S && S.rounds.length }) };
applySettings();
renderHome();
</script>
